<title>Pesquisa de Avaliação Ruphus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: trilho de etapas em cima; à esquerda a tela simulada (celular ou computador), à direita a regra da etapa */
:root {
  --bg: #f4f4f5; --card: #ffffff; --fg: #18181b; --muted: #71717a; --border: #e4e4e7;
  --primary: #27272a; --primary-fg: #fafafa; --soft: #f4f4f5;
  --star: #e8a20c; --ok: #15803d; --ok-bg: #ecfdf3; --warn-bg: #fffbeb; --warn-fg: #78350f; --warn-bd: #fcd34d;
  --wa-bg: #efeae2; --wa-out: #d9fdd3; --wa-in: #ffffff; --wa-head: #075e54; --wa-text: #111b21;
  --serif: "Instrument Serif", Georgia, serif; --sans: "Geist", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0f10; --card: #1c1c1f; --fg: #fafafa; --muted: #a1a1aa; --border: #2e2e33;
  --primary: #e4e4e7; --primary-fg: #18181b; --soft: #27272a;
  --ok: #4ade80; --ok-bg: #0f2a1a; --warn-bg: #2a1f05; --warn-fg: #fde68a; --warn-bd: #78350f;
  --wa-bg: #0b141a; --wa-out: #005c4b; --wa-in: #202c33; --wa-head: #202c33; --wa-text: #e9edef; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f0f10; --card: #1c1c1f; --fg: #fafafa; --muted: #a1a1aa; --border: #2e2e33;
  --primary: #e4e4e7; --primary-fg: #18181b; --soft: #27272a;
  --ok: #4ade80; --ok-bg: #0f2a1a; --warn-bg: #2a1f05; --warn-fg: #fde68a; --warn-bd: #78350f;
  --wa-bg: #0b141a; --wa-out: #005c4b; --wa-in: #202c33; --wa-head: #202c33; --wa-text: #e9edef; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1 { font: 400 clamp(28px, 5vw, 40px)/1.1 var(--serif); margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* trilho */
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.steps button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px 8px 8px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.steps button b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); font-weight: 600; font-size: 12px; color: var(--fg); }
.steps button[aria-current="step"] { color: var(--fg); border-color: var(--fg); font-weight: 600; }
.steps button[aria-current="step"] b { background: var(--primary); color: var(--primary-fg); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.note { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: grid; gap: 10px; font-size: 14px; }
.note h2 { font: 400 22px/1.15 var(--serif); margin: 0; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); }
.note .nav { display: flex; gap: 8px; margin-top: 4px; }
.tag { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* moldura */
.device { margin: 0 auto; width: 100%; max-width: 390px; border: 1px solid var(--border); border-radius: 28px; background: var(--card); overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 12px 32px -12px rgb(0 0 0 / .18); }
.device.pc { max-width: 100%; border-radius: 12px; }
.url { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.url::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

/* painel simulado */
.ph { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--border); }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font: 20px var(--serif); flex: none; }
.ph .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: none; gap: 2px; font-size: 13.5px; }
.pc .tabs { display: flex; }
.tabs span { padding: 0 10px; height: 56px; display: flex; align-items: center; color: var(--muted); white-space: nowrap; }
.tabs span.on { color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--fg); }
.pbody { padding: 20px 16px 24px; display: grid; gap: 16px; min-height: 520px; align-content: start; }
.pc .pbody { padding: 28px 28px 32px; }
.botnav { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); text-align: center; }
.pc .botnav { display: none; }
.botnav span { padding: 10px 0 12px; }
.botnav span.on { color: var(--fg); font-weight: 600; }
.ptitle { font: 400 28px/1.1 var(--serif); margin: 0; }
.box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: var(--card); }
.box h3 { margin: 0; font-size: 15px; font-weight: 600; }
.small { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 0; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; font-size: 14px; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--primary); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
select, .inp, textarea { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 8px 10px; min-height: 40px; }
textarea { width: 100%; box-sizing: border-box; resize: vertical; min-height: 92px; line-height: 1.45; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.vars button { border: 1px dashed var(--border); background: var(--soft); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: ui-monospace, monospace; }
.btn { border: 0; border-radius: 10px; background: var(--primary); color: var(--primary-fg); padding: 0 16px; height: 44px; font-weight: 500; cursor: pointer; }
.btn.out { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; }
.chip.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.alert { border: 1px solid var(--warn-bd); background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.okline { display: flex; gap: 8px; align-items: flex-start; background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.muted { color: var(--muted); }

/* caixa */
.sheet { border: 1px solid var(--border); border-radius: 18px 18px 0 0; padding: 18px; display: grid; gap: 14px; background: var(--card); box-shadow: 0 -8px 24px -12px rgb(0 0 0 / .2); }
.pc .sheet { border-radius: 16px; max-width: 460px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.money { font: 32px var(--serif); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
.toast { justify-self: center; background: var(--primary); color: var(--primary-fg); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }

/* whatsapp */
.wa { background: var(--wa-bg); min-height: 560px; display: flex; flex-direction: column; color: var(--wa-text); }
.wa-h { background: var(--wa-head); color: #fff; display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
.wa-h .av { width: 36px; height: 36px; border-radius: 50%; background: #fff3; display: grid; place-items: center; font: 18px var(--serif); }
.wa-h small { display: block; opacity: .75; font-size: 12px; }
.wa-b { flex: 1; padding: 16px 12px; display: grid; gap: 8px; align-content: start; }
.bub { max-width: 82%; padding: 7px 10px 18px; border-radius: 8px; font-size: 14.2px; line-height: 1.4; position: relative; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.in { background: var(--wa-in); justify-self: start; border-top-left-radius: 0; }
.bub.out { background: var(--wa-out); justify-self: end; border-top-right-radius: 0; }
.bub time { position: absolute; right: 8px; bottom: 3px; font-size: 10.5px; opacity: .6; }
.bub a { color: #027eb5; text-decoration: underline; cursor: pointer; }
.day { justify-self: center; background: var(--wa-in); font-size: 12px; padding: 3px 10px; border-radius: 6px; opacity: .85; }

/* pública */
.pub { background: #faf8f6; color: #1c1917; min-height: 560px; padding: 28px 22px; display: grid; gap: 18px; align-content: start; }
.pub .head { display: grid; justify-items: center; gap: 8px; text-align: center; }
.pub .logo { width: 56px; height: 56px; border-radius: 16px; font-size: 30px; background: #1c1917; color: #faf8f6; }
.pub h2 { font: 400 30px/1.1 var(--serif); margin: 0; text-wrap: balance; }
.pub .meta { font-size: 13.5px; color: #78716c; }
.stars { display: flex; justify-content: center; gap: 6px; border: 0; padding: 0; margin: 0; }
.stars legend { width: 100%; text-align: center; font-weight: 500; margin-bottom: 10px; font-size: 15px; }
.stars input { position: absolute; opacity: 0; pointer-events: none; }
.stars label { cursor: pointer; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; }
.stars svg { width: 38px; height: 38px; fill: #e7e5e4; transition: fill .12s, transform .12s; }
.stars label.lit svg { fill: var(--star); }
.stars input:focus-visible + label { outline: 2px solid #1c1917; }
.stars label:hover svg { transform: scale(1.08); }
.legenda { text-align: center; font-size: 13.5px; color: #78716c; min-height: 20px; }
.pub textarea { background: #fff; border-color: #e7e5e4; color: #1c1917; }
.pub .btn { background: #1c1917; color: #faf8f6; width: 100%; height: 50px; font-size: 15px; }
.pub .foot { text-align: center; font-size: 11.5px; color: #a8a29e; }
.pub .ok { display: grid; justify-items: center; gap: 10px; text-align: center; padding-top: 20px; }
.pub .ok .big { font-size: 44px; color: var(--star); letter-spacing: 4px; }
@media (prefers-reduced-motion: reduce) { .stars svg { transition: none; } }

/* painel avaliações */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.kpi b { font: 400 30px/1 var(--serif); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.prof { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.prow .track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.prow .fill { height: 100%; background: var(--star); }
.prow .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
.list { display: grid; gap: 0; }
.item { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--border); }
.item .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.item .st { color: var(--star); letter-spacing: 1px; }
.item .st.low { color: #dc2626; }
.item p { margin: 0; font-size: 14px; }
.pc .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
.duo { display: grid; gap: 16px; }
.empty { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 40px 12px; }
.empty .big { font: 400 26px/1.15 var(--serif); }
</style>

<div class="wrap">
  <header>
    <span class="tag">Protótipo · dados fictícios · Studio Lírio</span>
    <h1>Pesquisa de avaliação após o pagamento</h1>
    <p class="lead">Cinco telas do fluxo. É o dono quem liga a pesquisa: ela vem desligada. Mude as opções na etapa 1 e veja o efeito nas outras etapas.</p>
  </header>

  <nav class="steps" aria-label="Etapas do fluxo" id="steps"></nav>

  <div class="bar">
    <div class="seg" role="group" aria-label="Tamanho da tela">
      <button type="button" data-dev="cel" aria-pressed="true">Celular</button>
      <button type="button" data-dev="pc" aria-pressed="false">Computador</button>
    </div>
    <div class="seg" role="group" aria-label="Pesquisa ligada pelo dono">
      <button type="button" data-on="1" aria-pressed="false">Pesquisa ligada</button>
      <button type="button" data-on="0" aria-pressed="true">Desligada</button>
    </div>
  </div>

  <div class="stage">
    <div id="screen"></div>
    <aside class="note" id="note" aria-live="polite"></aside>
  </div>
</div>

<script>
const S = {
  step: 0, dev: "cel", on: false, prazo: "2h",
  msg: "Oi, {cliente}! Obrigada por vir ao {negocio} hoje 💛\nComo foi seu atendimento com {profissional}? Leva 10 segundos:\n{link}",
  pago: false, nota: 0, coment: "", pubEstado: "form", filtro: 0,
};
const NEG = "Studio Lírio", CLI = "Marina", PROF = "Camila", SERV = "Escova + hidratação";
const LINK = "ruphus.site/avaliar/studio-lirio/k3v9…?t=Qm8x";
const PRAZOS = { "1h": ["1 hora depois", "15:40"], "2h": ["2 horas depois", "16:40"], "dia": ["No dia seguinte, às 10h", "amanhã, 10:00"] };
const ROT = ["", "Ruim", "Fraco", "Bom", "Muito bom", "Excelente"];
const AV = [
  { n: 5, c: "Mariana P.", p: "Camila", s: "Escova + hidratação", d: "hoje, 17:02", t: "A Camila é maravilhosa, cabelo ficou perfeito!" },
  { n: 4, c: "Luciana R.", p: "Juliana", s: "Manicure e pedicure", d: "hoje, 11:20", t: "Gostei muito, só demorou um pouco pra começar." },
  { n: 2, c: "Patrícia M.", p: "Renata", s: "Design de sobrancelha", d: "ontem, 19:45", t: "Ficou desigual, tive que voltar para retocar." },
  { n: 5, c: "Bruna S.", p: "Juliana", s: "Unha em gel", d: "ontem, 15:10", t: "" },
  { n: 5, c: "Ana Clara F.", p: "Camila", s: "Corte feminino", d: "05/11, 18:30", t: "Sempre impecável." },
  { n: 3, c: "Fernanda L.", p: "Renata", s: "Limpeza de pele", d: "04/11, 10:05", t: "Atendimento bom, ambiente estava muito quente." },
];
const PROFS = [["Camila", 4.9, 18], ["Juliana", 4.6, 23], ["Renata", 3.8, 9]];
const STEPS = [
  ["configurar", "Dono liga"], ["caixa", "Recebi no caixa"], ["whatsapp", "Cliente recebe"], ["avaliar", "Cliente avalia"], ["painel", "Dono vê"],
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const msgFinal = () => S.msg.replaceAll("{cliente}", CLI).replaceAll("{negocio}", NEG).replaceAll("{profissional}", PROF).replaceAll("{link}", LINK);
const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';
const estrelas = (n) => "★".repeat(n) + "☆".repeat(5 - n);

function painel(aba, corpo) {
  const tabs = ["Agenda", "Serviços", "Profissionais", "Clientes", "Caixa", "Avaliações", "Meu negócio"];
  const curtos = ["Agenda", "Serviços", "Equipe", "Clientes", "Caixa", "Notas", "Negócio"];
  return `<div class="device ${S.dev}">
    <div class="url">ruphus.site/studio-lirio/${{ "Meu negócio": "negocio", "Caixa": "caixa", "Avaliações": "avaliacoes" }[aba]}</div>
    <div class="ph"><span class="logo">L</span><span class="nm">${NEG}</span>
      <nav class="tabs">${tabs.map((t) => `<span class="${t === aba ? "on" : ""}">${t}</span>`).join("")}</nav></div>
    <div class="pbody">${corpo}</div>
    <div class="botnav">${curtos.map((t, i) => `<span class="${tabs[i] === aba ? "on" : ""}">${t}</span>`).join("")}</div>
  </div>`;
}

const TELAS = [
  // 1. configurar
  () => painel("Meu negócio", `
    <h2 class="ptitle">Meu negócio</h2>
    <div class="box">
      <h3>Avaliação dos clientes</h3>
      <label class="chk"><input type="checkbox" id="on" ${S.on ? "checked" : ""}> Pedir avaliação depois do pagamento</label>
      ${S.on ? `
        <div class="row">Enviar
          <select id="prazo" aria-label="Quando enviar a pesquisa">
            ${Object.entries(PRAZOS).map(([k, [r]]) => `<option value="${k}" ${S.prazo === k ? "selected" : ""}>${r.toLowerCase()}</option>`).join("")}
          </select> do pagamento</div>
        <label for="msg" style="font-size:14px;font-weight:500">Mensagem</label>
        <textarea id="msg" maxlength="400">${esc(S.msg)}</textarea>
        <div class="vars" aria-label="Inserir campo">${["{cliente}", "{profissional}", "{negocio}", "{link}"].map((v) => `<button type="button" data-var="${v}">${v}</button>`).join("")}</div>
        ${S.msg.includes("{link}") ? "" : `<div class="alert">A mensagem precisa ter <b>{link}</b>. Sem ele, o cliente não tem onde avaliar.</div>`}
        <p class="small">Vai pelo WhatsApp do negócio, uma vez por atendimento pago no caixa. Não envia entre 22h e 7h30. Quem marcou “não receber campanhas” fica de fora. As notas aparecem só para você, na aba Avaliações.</p>
      ` : `<p class="small">Desligado. Nenhum cliente recebe pesquisa. Ligue para receber a nota de 1 a 5 e um comentário depois de cada atendimento pago.</p>`}
    </div>
    <div class="box" style="opacity:.55"><h3>WhatsApp do negócio</h3><p class="small">Conectado · (85) 9 8812-4410 · lembretes 2h antes</p></div>
  `),
  // 2. caixa
  () => painel("Caixa", S.pago ? `
    <h2 class="ptitle">Caixa</h2>
    <div class="toast">Recebido: R$ 120,00.</div>
    <div class="box"><div class="row" style="justify-content:space-between;color:var(--fg)"><span><b>Marina Souza</b> · ${SERV}</span><span style="font-variant-numeric:tabular-nums">+ R$ 120,00</span></div>
      <p class="small">Pix · 14:40 · com ${PROF}</p>
      ${S.on ? `<div class="okline">☆ Pesquisa de avaliação vai às ${PRAZOS[S.prazo][1]} pelo WhatsApp.</div>` : ""}
    </div>
    <button type="button" class="btn out" data-act="desfaz">Ver de novo a folha de receber</button>
  ` : `
    <h2 class="ptitle">Caixa</h2>
    <p class="small">Atendimentos de hoje a receber</p>
    <div class="sheet">
      <div><div style="font:26px/1.1 var(--serif)">Receber de Marina Souza</div><p class="small">${SERV} · com ${PROF}</p></div>
      <div style="display:grid;gap:6px"><span style="font-size:14px;font-weight:500">Valor</span><div class="money">R$ 120,00</div></div>
      <div style="display:grid;gap:8px"><span style="font-size:14px;font-weight:500">Recebido em</span>
        <div class="chips"><span class="chip">Dinheiro</span><span class="chip on">Pix</span><span class="chip">Débito</span><span class="chip">Crédito</span></div></div>
      ${S.on ? `<p class="small">☆ A cliente recebe a pesquisa de avaliação ${PRAZOS[S.prazo][0].toLowerCase()}.</p>` : ""}
      <button type="button" class="btn" data-act="pagar">Recebi</button>
    </div>
  `),
  // 3. whatsapp
  () => `<div class="device">
    <div class="wa">
      <div class="wa-h"><span class="av">L</span><div><b>${NEG}</b><small>conta comercial</small></div></div>
      <div class="wa-b">
        <span class="day">HOJE</span>
        <div class="bub in">Oi, Marina! Lembrete: seu horário de ${SERV.toLowerCase()} é hoje às 13:30 com ${PROF}.<time>11:30</time></div>
        <div class="bub out">Confirmado 👍<time>11:41</time></div>
        ${S.on && S.msg.includes("{link}") ? `<div class="bub in">${esc(msgFinal()).replace(esc(LINK), `<a data-go="3">${esc(LINK)}</a>`)}<time>${S.prazo === "dia" ? "10:00" : PRAZOS[S.prazo][1]}</time></div>`
          : `<span class="day" style="opacity:.7">${S.on ? "Mensagem sem {link}: nada é enviado" : "Pesquisa desligada: nada é enviado"}</span>`}
      </div>
    </div></div>`,
  // 4. pública
  () => {
    const corpo = S.pubEstado === "invalido" ? `
        <div class="ok"><h2>Página não encontrada</h2><p class="meta">Este link não existe ou foi digitado errado.</p></div>`
      : S.pubEstado === "ja" || S.pubEstado === "ok" ? `
        <div class="ok"><div class="big" aria-label="${S.nota || 5} de 5">${estrelas(S.nota || 5)}</div>
          <h2>${S.pubEstado === "ok" ? "Obrigada, Marina!" : "Você já avaliou este atendimento"}</h2>
          <p class="meta">${S.pubEstado === "ok" ? `Sua avaliação foi enviada para o ${NEG}.` : "Cada atendimento recebe uma avaliação só. Obrigada!"}</p></div>`
      : `
        <form id="pubf" style="display:grid;gap:16px">
          <fieldset class="stars"><legend>Como foi seu atendimento?</legend>
            ${[1, 2, 3, 4, 5].map((n) => `<input type="radio" name="nota" id="n${n}" value="${n}" ${S.nota === n ? "checked" : ""}><label for="n${n}" class="${n <= S.nota ? "lit" : ""}" aria-label="${n} de 5, ${ROT[n]}">${star}</label>`).join("")}
          </fieldset>
          <div class="legenda">${S.nota ? ROT[S.nota] : "Toque numa estrela"}</div>
          <label style="display:grid;gap:6px;font-size:14px;font-weight:500">Quer contar mais? <span style="font-weight:400;color:#78716c">(opcional)</span>
            <textarea id="coment" maxlength="500" placeholder="O que gostou, o que pode melhorar…">${esc(S.coment)}</textarea></label>
          <button class="btn" ${S.nota ? "" : "disabled"}>Enviar avaliação</button>
        </form>`;
    return `<div class="device">
      <div class="url">${LINK}</div>
      <div class="pub">
        ${S.pubEstado === "invalido" ? "" : `<div class="head"><span class="logo">L</span><h2>${NEG}</h2>
          <div class="meta">${SERV} com ${PROF} · hoje, 13:30</div></div>`}
        ${corpo}
        <div class="foot">Sua nota vai só para o ${NEG}. Não aparece no site.</div>
      </div></div>`;
  },
  // 5. painel
  () => {
    if (!S.on) return painel("Avaliações", `<div class="empty"><div class="big">Saiba o que seus clientes acharam</div>
      <p class="small" style="max-width:40ch">Ligue a pesquisa e cada cliente que pagar no caixa recebe um pedido de nota pelo WhatsApp. As notas aparecem aqui.</p>
      <button type="button" class="btn" data-go="0">Ligar em Meu negócio</button></div>`);
    const lista = AV.filter((a) => !S.filtro || (S.filtro === -1 ? a.n <= 3 : a.n === S.filtro));
    return painel("Avaliações", `
      <h2 class="ptitle">Avaliações</h2>
      <div class="chips" role="group" aria-label="Período"><span class="chip on">Últimos 30 dias</span><span class="chip">Este mês</span><span class="chip">Tudo</span></div>
      <div class="kpis">
        <div class="kpi"><b>4,6</b><span>média · ★★★★★</span></div>
        <div class="kpi"><b>50</b><span>avaliações</span></div>
        <div class="kpi"><b>62%</b><span>responderam</span></div>
      </div>
      <div class="duo">
        <div class="box"><h3>Por profissional</h3><div class="prof">
          ${PROFS.map(([n, m, q]) => `<div class="prow"><span>${n}</span><div class="track"><div class="fill" style="width:${(m / 5) * 100}%"></div></div><span class="v">${m.toFixed(1).replace(".", ",")} · ${q}</span></div>`).join("")}
        </div><p class="small">Média de 1 a 5 e número de avaliações.</p></div>
        <div class="box"><h3>Comentários</h3>
          <div class="chips" role="group" aria-label="Filtrar por nota">
            ${[[0, "Todas"], [-1, "3 ou menos"], [5, "★5"], [4, "★4"]].map(([v, r]) => `<button type="button" class="chip ${S.filtro === v ? "on" : ""}" data-filtro="${v}">${r}</button>`).join("")}
          </div>
          <div class="list">${lista.map((a) => `<div class="item"><div class="top"><span class="st ${a.n <= 3 ? "low" : ""}" aria-label="${a.n} de 5">${estrelas(a.n)}</span><span>${a.d}</span></div>
            <p>${a.t ? esc(a.t) : '<span class="muted">Sem comentário</span>'}</p><span class="small">${a.c} · ${a.s} · com ${a.p}</span></div>`).join("") || '<p class="small">Nenhuma avaliação nesse filtro.</p>'}</div>
        </div>
      </div>`);
  },
];

const NOTAS = [
  ["O dono decide", ["A pesquisa vem desligada. Liga e desliga em Meu negócio, perto dos lembretes.", "Ele escolhe quando enviar: 1h, 2h ou no dia seguinte às 10h.", "A mensagem pode ser editada. Ela precisa ter o {link}.", "Só aparece com o WhatsApp do negócio conectado."]],
  ["Nada muda no caixa", ["O “Recebi” continua igual. Com a pesquisa ligada, uma linha avisa a que horas ela sai.", "O envio não acontece na hora do pagamento: a rotina de 10 em 10 min manda depois do prazo.", "Lançamento manual, sem cliente, não gera pesquisa.", "Se o pagamento for estornado antes do envio, a pesquisa não sai."]],
  ["Uma mensagem só", ["Sai uma vez por atendimento, do número do negócio.", "Não sai entre 22h e 7h30. Quem cair nessa janela recebe às 7h30.", "Clientes com “não receber campanhas” não recebem.", "Toque no link da mensagem para abrir a página da cliente."]],
  ["Página sem login", ["Abre direto pelo link assinado, sem conta e sem senha.", "Uma estrela já basta para enviar. O comentário é opcional.", "Abrir o link de novo mostra “já avaliou”. Link alterado mostra “não encontrado”.", "A nota vai só para o negócio. Não muda a nota do Google no site."]],
  ["Retorno para o dono", ["Mostra a média, o total e a taxa de resposta.", "Mostra a média por profissional, para conversar com a equipe.", "O filtro “3 ou menos” separa quem saiu insatisfeito.", "Com a pesquisa desligada, a aba convida a ligar."]],
];

function render() {
  document.getElementById("steps").innerHTML = STEPS.map(([, r], i) => `<button type="button" data-go="${i}" ${i === S.step ? 'aria-current="step"' : ""}><b>${i + 1}</b>${r}</button>`).join("");
  document.querySelectorAll("[data-dev]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.dev === S.dev));
  document.querySelectorAll("[data-on]").forEach((b) => b.setAttribute("aria-pressed", (b.dataset.on === "1") === S.on));
  document.getElementById("screen").innerHTML = TELAS[S.step]();
  const [t, itens] = NOTAS[S.step];
  const extra = S.step === 3 ? `<div class="seg" role="group" aria-label="Estado da página" style="flex-wrap:wrap">${[["form", "Formulário"], ["ok", "Enviado"], ["ja", "Já avaliou"], ["invalido", "Link errado"]].map(([k, r]) => `<button type="button" data-pub="${k}" aria-pressed="${S.pubEstado === k}">${r}</button>`).join("")}</div>` : "";
  document.getElementById("note").innerHTML = `<span class="tag">Etapa ${S.step + 1} de ${STEPS.length}</span><h2>${t}</h2><ul>${itens.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${extra}
    <div class="nav">${S.step ? `<button type="button" class="btn out" data-go="${S.step - 1}">Voltar</button>` : ""}${S.step < STEPS.length - 1 ? `<button type="button" class="btn" data-go="${S.step + 1}">Próxima etapa</button>` : ""}</div>`;
}
function go(i) { S.step = i; try { history.replaceState(null, "", "#" + STEPS[i][0]); } catch {} render(); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-dev],[data-on],[data-act],[data-pub],[data-filtro],[data-var]");
  if (!el) return;
  const d = el.dataset;
  if (d.go !== undefined) return go(+d.go);
  if (d.dev) S.dev = d.dev;
  if (d.on) S.on = d.on === "1";
  if (d.act === "pagar") S.pago = true;
  if (d.act === "desfaz") S.pago = false;
  if (d.pub) S.pubEstado = d.pub;
  if (d.filtro !== undefined) S.filtro = +d.filtro;
  if (d.var) { const ta = document.getElementById("msg"); const p = ta.selectionStart ?? S.msg.length; S.msg = S.msg.slice(0, p) + d.var + S.msg.slice(ta.selectionEnd ?? p); }
  render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "on") { S.on = e.target.checked; render(); }
  if (e.target.id === "prazo") { S.prazo = e.target.value; render(); }
  if (e.target.name === "nota") { S.nota = +e.target.value; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "msg") { const had = S.msg.includes("{link}"); S.msg = e.target.value; if (had !== S.msg.includes("{link}")) { const p = e.target.selectionStart; render(); const ta = document.getElementById("msg"); ta.focus(); ta.setSelectionRange(p, p); } }
  if (e.target.id === "coment") S.coment = e.target.value;
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (S.nota) { S.pubEstado = "ok"; render(); } });

const fromHash = () => { const i = STEPS.findIndex(([k]) => "#" + k === location.hash); if (i >= 0) S.step = i; render(); };
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
